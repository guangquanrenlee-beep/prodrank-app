name = "prodrank"
handle = "prodrank-ai-commerce-seo"
client_id = "68693bd65e752d8ba73f896e37709114"
application_url = "https://api.prodrank.app"
embedded = true

[access_scopes]
scopes = "read_products,write_products,read_themes,write_themes,read_content,write_content"

[auth]
redirect_urls = ["https://api.prodrank.app/api/shopify/callback", "https://prodrank.app/api/shopify/callback"]

[webhooks]
api_version = "2026-07"

# ⑧ Webhook Listener — incremental sync + lifecycle events
[[webhooks.subscriptions]]
topics = ["products/update", "products/create"]
uri = "https://api.prodrank.app/api/shopify/webhook/products/update"

[[webhooks.subscriptions]]
topics = ["inventory_levels/update"]
uri = "https://api.prodrank.app/api/shopify/webhook/inventory_levels/update"

[[webhooks.subscriptions]]
topics = ["themes/publish"]
uri = "https://api.prodrank.app/api/shopify/webhook/themes/publish"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "https://api.prodrank.app/api/shopify/webhook/app/uninstalled"

extension_directories = ["extensions/schema-inject"]
