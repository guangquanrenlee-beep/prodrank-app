# ProdRank backend reverse proxy (Docker nginx container).
# Mounted into the nginx service in backend/docker-compose.yml.
# NOTE: if your VPS copy differs from this file, sync it manually
# (e.g. /opt/prodrank/.../nginx.conf) then `docker compose restart nginx`.

server {
    listen 443 ssl;
    listen 80;
    server_name _;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Client IP propagation — Cloudflare sets CF-Connecting-IP; these
    # headers let the app (rate limiter) and access logs see the real client.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API only accepts small JSON bodies — reject oversized payloads.
    client_max_body_size 1m;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}
