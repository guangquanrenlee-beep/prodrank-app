name: Deploy to VPS

on:
  push:
    branches: [main, deploy]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/prodrank
            git pull origin main || git clone https://github.com/guangquanrenlee-beep/prodrank-app.git .
            echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" > .env
            echo "OPENAI_BASE_URL=${{ secrets.OPENAI_BASE_URL }}" >> .env
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
            echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" >> .env
            echo "SHOPIFY_CLIENT_ID=${{ secrets.SHOPIFY_CLIENT_ID }}" >> .env
            echo "SHOPIFY_CLIENT_SECRET=${{ secrets.SHOPIFY_CLIENT_SECRET }}" >> .env
            docker compose up -d --build --remove-orphans
